# Pipeline de calidad y seguridad de Atlas (EP3 ISY1102)
# Cada push o pull request pasa por los controles automatizados.
# Si un control crítico falla, el "gate" bloquea el merge a main.
name: Calidad y seguridad

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

env:
  DB_USER: atlas_admin
  DB_NAME: atlas_db
  # Los secretos se guardan en GitHub > Settings > Secrets, nunca en el código
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  COMPOSE_PROJECT_NAME: atlas   # nombre fijo para las imágenes, sin importar el nombre del repo

jobs:
  # 1) Análisis estático: secretos expuestos + reglas de seguridad en el código
  sast:
    name: SAST y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Buscar secretos en el repositorio (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # solo necesario si el repo es de una organización
      - name: Buscar contraseñas y secretos JWT en archivos de configuración
        if: success() || failure()
        run: |
          bash tests/security/check_secrets.sh . | tee secretos.txt
          if grep -qE "PASSWORD|SECRET" secretos.txt; then echo "Secretos encontrados en el repositorio"; exit 1; fi
      - uses: actions/setup-node@v5
        if: success() || failure()
        with: { node-version: 22 }
      - name: ESLint con eslint-plugin-security
        if: success() || failure()
        working-directory: backend
        run: npm ci && npx eslint . --max-warnings=0

  # 2) Análisis de dependencias (SCA)
  sca:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: npm audit backend
        working-directory: backend
        run: npm ci && npm audit --audit-level=high
      - name: npm audit frontend
        if: success() || failure()
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  # 3) Construcción de imágenes y escaneo del contenedor
  build:
    name: Build y escaneo de imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir imágenes Docker
        run: docker compose build
      - name: Escanear imagen del backend (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: atlas-atlas-backend
          severity: CRITICAL,HIGH
          exit-code: '1'

  # 4) Pruebas automatizadas funcionales, no funcionales y DAST
  pruebas:
    name: Pruebas automatizadas y DAST
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Levantar Atlas
        run: docker compose up -d --build && sleep 20
      - name: Instalar herramientas de prueba
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas de API (Postman / Newman)
        if: success() || failure()   # se ejecuta aunque falle la prueba anterior
        working-directory: tests
        run: npm run test:api
      - name: Pruebas de seguridad de la API
        if: success() || failure()   # se ejecuta aunque falle la prueba anterior
        working-directory: tests
        run: npm run test:security
      - name: Pruebas E2E (Playwright)
        if: success() || failure()   # se ejecuta aunque falle la prueba anterior
        working-directory: tests
        run: npm run test:e2e
      - name: Rendimiento y accesibilidad (Lighthouse)
        if: success() || failure()   # se ejecuta aunque falle la prueba anterior
        working-directory: tests
        run: npm run test:lighthouse
      - name: Escaneo DAST (OWASP ZAP baseline)
        if: success() || failure()   # se ejecuta aunque falle la prueba anterior
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          fail_action: true
      - name: Guardar reportes como evidencia (90 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: tests/reports
          retention-days: 90

  # 5) Gate de calidad: solo si todo lo anterior pasó se permite desplegar
  gate:
    name: Gate de calidad
    needs: [sast, sca, build, pruebas]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar resultado de los controles
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Gate RECHAZADO: hay controles fallidos. Revisar reportes y corregir defectos."; exit 1
          fi
          echo "Gate APROBADO: build habilitado para despliegue."